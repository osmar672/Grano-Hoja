services:
  db:
    image: mysql:8.4
    container_name: raiz-madera-mysql
    restart: unless-stopped
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-raiz_madera}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Crea .env y define MYSQL_ROOT_PASSWORD}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-raiz_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Define MYSQL_APP_PASSWORD en el .env raíz}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - raiz_madera_mysql_data:/var/lib/mysql
      - ./deploy/mysql/00-create-app-user.sh:/docker-entrypoint-initdb.d/00-create-app-user.sh:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  n8n:
    image: n8nio/n8n:stable
    container_name: raiz-madera-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en el .env raíz}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/Costa_Rica
      TZ: America/Costa_Rica
    volumes:
      - raiz_madera_n8n_data:/home/node/.n8n
    security_opt: ["no-new-privileges:true"]

volumes:
  raiz_madera_mysql_data:
  raiz_madera_n8n_data:
