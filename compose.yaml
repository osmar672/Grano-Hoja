services:
  db:
    image: postgres:18-alpine
    container_name: raiz-madera-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raiz_madera}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crea .env desde .env.example y define POSTGRES_PASSWORD}
      TZ: America/Costa_Rica
    ports:
      - "5432:5432"
    volumes:
      - raiz_madera_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  raiz_madera_data:
